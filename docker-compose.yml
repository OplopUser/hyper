services:
  bot:
    image: ghcr.io/oplopuser/hyper:latest
    container_name: hyper-bot
    restart: unless-stopped
    command: ["python", "main.py"]
    env_file: .env
    volumes:
      - ./logs:/app/logs        # bot logs (dashboard reads these)

  dashboard:
    image: ghcr.io/oplopuser/hyper:latest
    container_name: hyper-dashboard
    restart: unless-stopped
    command: ["python", "dashboard.py"]
    env_file: .env
    ports:
      - "5050:5050"
    volumes:
      - ./logs:/app/logs        # read bot logs
